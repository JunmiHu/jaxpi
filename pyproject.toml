[project]
name = "jaxpi"
version = "0.1.0"
description = "JAX-PI PINN research code"
readme = "README.md"
requires-python = ">=3.11"

# Core runtime (CPU) – keep lean; GPU / extras below
dependencies = [
  "numpy==2.3.2",
  "jax==0.7.0",          # pure CPU; choose one of cuda extras instead if on GPU
  "jaxlib==0.7.0",
  "flax==0.11.1",
  "optax==0.2.5",
  "chex==0.1.90",
  "ml-collections==1.1.0",
  "ml-dtypes==0.5.3",
  "scipy==1.16.1",
  "matplotlib==3.10.5",
  "absl-py==2.3.1",
  "etils==1.13.0",
  "orbax-checkpoint==0.11.21",
  "tensorstore==0.1.76",
  "tabulate==0.9.0",
  "wandb==0.21.1",
  "requests==2.32.4",
  "protobuf==6.31.1",
  "rich==14.1.0",
  "opt-einsum==3.4.0",
  "jaxtyping==0.3.2",
  "sympy==1.14.0",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.2",
  "packaging==25.0",
  "typing-extensions==4.14.1"
]

[project.optional-dependencies]
# Full CUDA (preferred: install only one of these env profiles)
cuda12 = [
  "jax-cuda12-pjrt==0.7.0",
  "jax-cuda12-plugin==0.7.0"
]

# Extended scientific / PDE helpers
pde = [
  "psgd-jax==0.2.9",
  "soap-jax @ git+https://github.com/haydn-jones/SOAP_JAX@2c0c34fa02ae91ead7d8a65c3309a5cdaf8a091c"
]

# Visualization / reporting
viz = [
  "humanize==4.12.3",
  "pillow==11.3.0"
]

# Dev / tooling
dev = [
  "click==8.2.1",
  "aiofiles==24.1.0",
  "filelock==3.18.0",
  "platformdirs==4.3.8",
  "simplejson==3.20.1",
  "pytest",
  "black",
  "ruff"
]

# Text / docs
docs = [
  "markdown-it-py==4.0.0",
  "mdurl==0.1.2",
  "pygments==2.19.2",
]

# Optional deep learning interop
torch = [
  "torch==2.8.0",
  "triton==3.4.0"
]

[tool.uv]
# (optional uv settings if you use uv; leave empty or configure as needed)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"